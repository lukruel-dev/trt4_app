services:
  # ---------------------------------------------------------------------------
  # Backend API - NestJS
  # ---------------------------------------------------------------------------
  - type: web
    name: trt4-favorecidos-api
    runtime: node
    plan: free
    region: oregon
    rootDir: apps/api
    buildCommand: npm install --include=dev && npx prisma generate && npx prisma db push --accept-data-loss && npm run build
    startCommand: npm run start
    healthCheckPath: /favorecidos/stats
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false

  # ---------------------------------------------------------------------------
  # Full-Stack Web - Next.js (com API routes e Prisma integrados)
  # ---------------------------------------------------------------------------
  - type: web
    name: trt4-favorecidos-web
    runtime: node
    plan: free
    region: oregon
    rootDir: apps/web
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npm run start
    healthCheckPath: /api/favorecidos/stats
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: AUTH_GOOGLE_ID
        sync: false
      - key: AUTH_GOOGLE_SECRET
        sync: false
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: AUTH_URL
        value: "https://trt4-favorecidos-web.onrender.com"
      - key: NEXTAUTH_URL
        value: "https://trt4-favorecidos-web.onrender.com"



