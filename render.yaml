services:
  # ---------------------------------------------------------------------------
  # Backend API - NestJS
  # ---------------------------------------------------------------------------
  - type: web
    name: trt4-favorecidos-api
    runtime: node
    plan: free
    region: oregon
    rootDir: apps/api
    buildCommand: npm install --include=dev && npx prisma generate && npx prisma db push --accept-data-loss && npm run build
    startCommand: npm run start
    healthCheckPath: /favorecidos/stats
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false

  # ---------------------------------------------------------------------------
  # Frontend Web - Next.js
  # ---------------------------------------------------------------------------
  - type: web
    name: trt4-favorecidos-web
    runtime: node
    plan: free
    region: oregon
    rootDir: apps/web
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: AUTH_GOOGLE_ID
        sync: false
      - key: AUTH_GOOGLE_SECRET
        sync: false

