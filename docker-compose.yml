version: '3.9'
services:
  postgres:
    image: postgres:16
    container_name: favorecidos_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: favorecidos_db
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data:
